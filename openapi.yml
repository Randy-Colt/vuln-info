openapi: 3.0.0
info:
  title: Information Exchange Service
  description: API для обмена информацией об угрозах.
  version: 1.0.0

paths:
  /info/{md5}:
    get:
      summary: Получить информацию об угрозе по MD5
      description: Возвращает полную информацию об угрозе для указанного MD5-хеша.
      operationId: getInfoByMd5
      parameters:
        - $ref: '#/components/parameters/Md5Path'
      responses:
        '200':
          description: Успешный ответ с информацией об угрозе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatResponse'
        '400':
          description: Некорректный формат MD5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Угроза с указанным MD5 не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Обновить информацию об угрозе по MD5
      description: Полностью заменяет информацию о существующей угрозе. Поле `md5` неизменяемо.
      operationId: updateThreat
      parameters:
        - $ref: '#/components/parameters/Md5Path'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatUpdateRequest'
      responses:
        '200':
          description: Информация успешно обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatResponse'
        '400':
          description: Некорректные данные запроса или MD5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Угроза с указанным MD5 не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /info:
    post:
      summary: Создать новую запись об угрозе
      description: Добавляет новую информацию об угрозе. MD5 должен быть уникальным.
      operationId: createThreat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatCreateRequest'
      responses:
        '201':
          description: Запись успешно создана
          headers:
            Location:
              description: URL созданной записи
              schema:
                type: string
                example: "/info/d41d8cd98f00b204e9800998ecf8427e"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatResponse'
        '400':
          description: Некорректные данные запроса (например, невалидный MD5 или имя)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Угроза с таким MD5 уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    Md5Path:
      name: md5
      in: path
      required: true
      description: MD5-хеш файла (32 шестнадцатеричных символа)
      schema:
        type: string
        pattern: '^[a-fA-F0-9]{32}$'
        example: "d41d8cd98f00b204e9800998ecf8427e"

  schemas:
    ThreatCreateRequest:
      type: object
      required:
        - md5
        - name
        - file_size
      properties:
        md5:
          type: string
          pattern: '^[a-fA-F0-9]{32}$'
          description: MD5-хеш файла (32 шестнадцатеричных символа)
          example: "d41d8cd98f00b204e9800998ecf8427e"
        name:
          type: string
          description: |
            Название угрозы в формате `<behavior>.<platform>.<family>`.
          example: "Trojan.Win32.Generic"
        file_size:
          type: integer
          format: int64
          minimum: 0
          description: Размер файла в байтах
          example: 102400
        file_type:
          type: string
          nullable: true
          description: Тип файла (pe, elf, script, ...). null или отсутствие — 'неизвестно'.
          example: "pe"

    ThreatUpdateRequest:
      type: object
      required:
        - name
        - file_size
      properties:
        name:
          type: string
          description: |
            Название угрозы в формате `<behavior>.<platform>.<family>`.
          example: "Trojan.Win32.Generic"
        file_size:
          type: integer
          format: int64
          minimum: 0
          example: 102400
        file_type:
          type: string
          nullable: true
          description: Тип файла (pe, elf, script, ...). null или отсутствие — 'неизвестно'.
          example: "pe"

    ThreatResponse:
      type: object
      required:
        - md5
        - name
        - file_size
        - created_at
      properties:
        md5:
          type: string
          pattern: '^[a-fA-F0-9]{32}$'
          description: MD5-хеш
          example: "d41d8cd98f00b204e9800998ecf8427e"
        name:
          type: string
          description: |
            Название угрозы в формате `<behavior>.<platform>.<family>`.
          example: "Trojan.Win32.Generic"
        file_size:
          type: integer
          format: int64
          minimum: 0
          example: 102400
        file_type:
          type: string
          nullable: true
          description: Тип файла (pe, elf, script, ...). Если не был передан при создании — 'неизвестно'.
          example: "pe"
        created_at:
          type: string
          format: date-time
          description: Время создания записи (UTC)
          example: "2024-01-15T10:30:45.123Z"

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Человекочитаемое описание ошибки
          example: "Threat not found"
        details:
          type: string
          description: Дополнительная информация
          example: "No threat with MD5 d41d8cd98f00b204e9800998ecf8427e found"